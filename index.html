<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 style="font-family:'ArcadeClassic', Times, serif;color: rgb(248, 164, 55);">Bem Vindo(a) ao </h1><h1 style="font-family:'ArcadeClassic', Times, serif;color: rgb(94, 191, 165);">Retro Games!!</h1>
        <p style="font-family:'ArcadeClassic', Times, serif;">Venda de Jogos Antigos</p>
        <p style="font-family:'ArcadeClassic', Times, serif;">Mate a nostalgia aqui com a gente!!</p>
    </header>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2 style="font-family:'ArcadeClassic', Times, serif;color: #f2bb05;">Nosso Catalogo</h2>
                <p style="font-family:'ArcadeClassic', Times, serif;">Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar <br> Jogo</button>
        </div>
        <section id="listaJogos" class="listaJogos">
            <p id="MensagemVazia" style="font-family:'ArcadeClassic', Times, serif;color: #d74e09;">Nenhum jogo cadastrado ainda</p>
        </section>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo Disco</h2>
        <form id="formJogos">
            <label for="Nome">Nome do Jogo</label>
            <input type="text" id="Nome" required>
            <label for="Autor">Autor do Jogo</label>
            <input type="text" id="Autor" required>
            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do Jogo</label>
            <input type="url" id="imagem" placeholder="https://exemplo.com/capa.webp" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar disco</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
